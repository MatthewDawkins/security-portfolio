<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eidolon — Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace, sans-serif;
      background: #0a0c10;
      color: #e2e8f0;
      font-size: 13px;
      min-height: 100vh;
    }

    /* Top nav */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 28px;
      background: #0f1117;
      border-bottom: 1px solid #1e2230;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo img { width: 32px; height: 32px; }
    .logo h1 { font-size: 17px; font-weight: 700; letter-spacing: 0.5px; }
    .logo span { color: #00d4aa; }

    /* Summary tiles */
    .summary {
      display: flex;
      gap: 16px;
    }
    .tile {
      background: #141720;
      border: 1px solid #1e2230;
      border-radius: 8px;
      padding: 10px 20px;
      text-align: right;
    }
    .tile-value { font-size: 24px; font-weight: 700; color: #00d4aa; }
    .tile-label { font-size: 10px; color: #64748b; letter-spacing: 0.5px; text-transform: uppercase; }

    /* Main content */
    main { padding: 24px 28px; }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #64748b;
      margin-bottom: 12px;
    }

    /* Tab cards */
    .tab-card {
      background: #0f1117;
      border: 1px solid #1e2230;
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .tab-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
    }
    .tab-header:hover { background: #141720; }

    .tab-url {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      color: #94a3b8;
    }
    .tab-url strong { color: #e2e8f0; font-weight: 500; }

    .badge {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 12px;
      padding: 2px 10px;
      font-size: 11px;
      color: #f56565;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge.green { color: #00d4aa; border-color: #00d4aa44; background: #00d4aa0f; }
    .badge.zero  { color: #4a5568; }

    .chevron { color: #4a5568; font-size: 11px; transition: transform 0.2s; }
    .tab-card.open .chevron { transform: rotate(90deg); }

    /* Request table */
    .request-table {
      display: none;
      border-top: 1px solid #1e2230;
    }
    .tab-card.open .request-table { display: block; }

    .request-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 8px;
      align-items: center;
      padding: 7px 16px;
      border-bottom: 1px solid #0a0c10;
      font-size: 11px;
    }
    .request-row:last-child { border-bottom: none; }
    .request-row.header {
      background: #0a0c10;
      color: #4a5568;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 5px 16px;
    }

    .domain { color: #e2e8f0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .type   { color: #64748b; }
    .reason { color: #f56565; }
    .time   { color: #4a5568; text-align: right; }

    /* Protections row */
    .protections {
      display: flex;
      gap: 8px;
      padding: 8px 16px;
      background: #0a0c10;
      border-top: 1px solid #1e2230;
    }

    .empty-tabs {
      text-align: center;
      padding: 60px 0;
      color: #4a5568;
    }
    .empty-tabs p { font-size: 14px; margin-bottom: 8px; }
    .empty-tabs small { font-size: 11px; }

    /* Refresh button */
    .refresh-btn {
      background: #141720;
      border: 1px solid #1e2230;
      border-radius: 6px;
      color: #94a3b8;
      font-size: 12px;
      padding: 6px 14px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .refresh-btn:hover { border-color: #00d4aa; color: #00d4aa; }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="icons/icon48.png" alt="Eidolon">
      <h1>Eid<span>olon</span></h1>
    </div>
    <div class="summary">
      <div class="tile">
        <div class="tile-value" id="total-blocked">0</div>
        <div class="tile-label">Total Blocked</div>
      </div>
      <div class="tile">
        <div class="tile-value" id="tabs-active">0</div>
        <div class="tile-label">Active Tabs</div>
      </div>
    </div>
  </header>

  <main>
    <div class="section-title">Active Tabs</div>
    <div id="tabs-container">
      <div class="empty-tabs">
        <p>No tab data yet.</p>
        <small>Browse a few pages and come back.</small>
      </div>
    </div>
    <div style="margin-top: 16px; text-align: right;">
      <button class="refresh-btn" id="refresh-btn">Refresh</button>
    </div>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
