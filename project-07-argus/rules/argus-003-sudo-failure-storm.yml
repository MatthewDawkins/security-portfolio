title: Repeated Sudo Failure
id: argus-003
status: stable
description: >
  Detects repeated failed sudo attempts by the same user, indicating an attempt
  to escalate privileges via sudo with incorrect credentials or unauthorised
  command execution.
author: Matthew Dawkins
date: 2026/05/13
tags:
  - attack.privilege_escalation
  - attack.t1548.003
logsource:
  category: authentication
  product: linux
type: threshold
detection:
  selection:
    event_type: sudo_failure
  threshold:
    field: user
    count: 3
    timewindow: 60
  condition: selection | threshold
falsepositives:
  - User forgetting sudo password
  - Developers testing scripts that call sudo
level: medium
mitre:
  technique: T1548.003
  tactic: Privilege Escalation
  name: Abuse Elevation Control Mechanism - Sudo
tuning_notes: >
  3 failures in 60s is a tight threshold — raise to 5 in developer environments
  where engineers frequently use sudo interactively. Pair with vigil-011
  (privilege escalation chain) for higher-confidence detections.
