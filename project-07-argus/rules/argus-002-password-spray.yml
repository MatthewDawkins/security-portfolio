title: Password Spray Attack
id: argus-002
status: stable
description: >
  Detects a single source IP attempting authentication against many different
  user accounts. Unlike brute force (many attempts, one user), password spraying
  uses one or few passwords across many accounts to avoid lockout policies.
author: Matthew Dawkins
date: 2026/05/13
tags:
  - attack.credential_access
  - attack.t1110.003
logsource:
  category: authentication
  product: linux
type: threshold
detection:
  selection:
    event_type: auth_failure
  threshold:
    field: src_ip
    count: 8
    timewindow: 120
  condition: selection | threshold
falsepositives:
  - Misconfigured SSO systems attempting multiple accounts
  - Pentest activity
  - Legitimate shared egress IP for a large organisation
level: high
mitre:
  technique: T1110.003
  tactic: Credential Access
  name: Brute Force - Password Spraying
tuning_notes: >
  Password spraying typically shows a low per-account failure rate but high
  unique-user count per source IP. This rule fires on total failures from one IP;
  for higher-fidelity detection, correlate with unique user count per IP.
  Tighten window to 60s in high-security environments.
