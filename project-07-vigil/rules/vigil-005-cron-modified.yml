title: Cron Job Added or Modified
id: vigil-005
status: stable
description: >
  Detects modification to crontab files or the cron.d directory. Attackers
  add cron jobs to execute malicious payloads on a schedule, maintaining
  persistence even after the initial process is terminated.
author: Matthew Dawkins
date: 2026/05/13
tags:
  - attack.persistence
  - attack.t1053.003
logsource:
  category: file
  product: linux
type: match
detection:
  selection:
    event_type: cron_modified
  condition: selection
falsepositives:
  - Legitimate application installers adding scheduled maintenance jobs
  - System administrators managing backup schedules
  - Package manager updates (apt, yum) adding package-managed cron jobs
level: medium
mitre:
  technique: T1053.003
  tactic: Persistence
  name: Scheduled Task/Job - Cron
tuning_notes: >
  Correlate with the user performing the modification. Root-owned cron
  modifications by non-root users are impossible in standard configs, so any
  such event is highly suspicious. Modifications outside business hours
  or by recently-created accounts warrant escalation.
