title: Credential Dump Pattern - Shadow Read Followed by Process Exec
id: vigil-013
status: stable
description: >
  Detects a credential dumping sequence: access to /etc/shadow followed by
  execution of a suspicious process on the same host within 5 minutes. This
  two-step pattern indicates an attacker reading password hashes and then
  using a process (nc, socat, python, curl) to exfiltrate them.
author: Matthew Dawkins
date: 2026/05/13
tags:
  - attack.credential_access
  - attack.t1003.008
logsource:
  category: file
  product: linux
type: sequence
detection:
  sequence:
    steps: [shadow_read, exfil_process]
    correlate: host
    maxspan: 300
  shadow_read:
    event_type: file_access
    file_path|contains: /etc/shadow
  exfil_process:
    event_type: process_exec
    process:
      - nc
      - ncat
      - netcat
      - socat
      - python
      - python3
      - curl
      - wget
  condition: shadow_read then exfil_process
falsepositives:
  - Backup scripts that read /etc/shadow and then invoke curl to upload backups
  - Security scanners performing automated credential audits
level: critical
mitre:
  technique: T1003.008
  tactic: Credential Access
  name: OS Credential Dumping - /etc/passwd and /etc/shadow
tuning_notes: >
  The combination of shadow file access + outbound process is high confidence.
  python and curl are the highest-FP entries - consider restricting to cases
  where the shadow read is by a non-system user. Alert should be escalated
  immediately regardless of time of day.
