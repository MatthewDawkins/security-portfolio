title: Multiple Account Lockouts
id: vigil-010
status: stable
description: >
  Detects multiple account lockout events in a short window, which may indicate
  a password spray or brute force attack that has triggered lockout policies.
  Also fires for single high-value account lockouts (root, admin).
author: Matthew Dawkins
date: 2026/05/13
tags:
  - attack.credential_access
  - attack.t1110
logsource:
  category: authentication
  product: linux
type: threshold
detection:
  selection:
    event_type: account_lockout
  threshold:
    field: dest_host
    count: 3
    timewindow: 120
  condition: selection | threshold
falsepositives:
  - Employee forgetting password after a policy change
  - Shared service account credentials being used concurrently
level: medium
mitre:
  technique: T1110
  tactic: Credential Access
  name: Brute Force
tuning_notes: >
  Group by dest_host to detect attacks targeting a specific system.
  Consider also alerting on a single lockout of privileged accounts
  (root, admin, service accounts) regardless of threshold.
